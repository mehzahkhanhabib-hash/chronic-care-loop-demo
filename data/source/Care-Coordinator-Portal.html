.prow.dif .pd{background:var(--accent);border-color:var(--accent)}
.prow.wrong .pd{background:var(--crit);border-color:var(--crit)}
.prow .mbr{display:block;margin-top:2px;font-size:11px;color:var(--ink-2)}
.prow .mbr b{display:inline!important;font-weight:600}
.pdiff{margin:4px 0 10px 28px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.pdiff-k{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pdiff-rec{display:flex;flex-direction:column;gap:2px;font-size:12px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px dashed var(--line)}
.pdiff-rec span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pdiff-rec small{color:var(--muted)}
.pdiff-f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.pdiff-f input,.pdiff-f select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-weight:400;font-size:12.5px;background:var(--surface);color:var(--ink)}
.rvseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;background:var(--surface)}
.rvseg .rv{font:inherit;font-size:12px;font-weight:600;border:0;border-left:1px solid var(--line);background:none;color:var(--ink-2);padding:6px 11px;cursor:pointer;white-space:nowrap}
.rvseg .rv:first-child{border-left:0}
.rvseg .rv:hover{background:var(--surface-2)}

.qav.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.risk-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface)}
.risk-dot.crit{background:var(--crit)}.risk-dot.high{background:var(--high)}.risk-dot.mod{background:var(--mod)}.risk-dot.ok{background:var(--ok)}
.pwm:not([data-act]){cursor:default}
.qlist{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.qhead{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line-2)}
.qhead .row{display:flex;align-items:center;gap:8px}
.qhead h2{font-size:15px}
.qitems{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.qi{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.qi:hover{border-color:var(--accent)}
.qi.on{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}
.qi .r1{display:flex;align-items:center;gap:8px}.qi .r1 b{font-size:13px;font-weight:600;flex:1}
.qi .rsn{font-size:12px;color:var(--ink-2)}
.qi .r3{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.qi .r3 .w{margin-left:auto;font-family:var(--mono)}
.qi .w.breach{color:var(--crit);font-weight:600}
.qdone{font-size:11px;color:var(--muted);padding:8px 4px 2px;font-weight:600}
.qd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;background:var(--surface-2);font-size:12px;text-align:left}
.qd .ck{color:var(--ok);font-weight:700}
.work{overflow-y:auto;min-height:0;padding:20px 24px 40px;container-type:inline-size}
.work-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mh{padding:20px 24px}
.mh .r1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mh .ini{width:48px;height:48px;border-radius:12px;background:var(--info-soft);color:var(--info);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.mh .nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mh .nm b{font-size:18.5px;font-weight:600}
.mh .meta{font-size:12px;color:var(--muted)}
.mh .acts{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 12px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:600}
.live.dial{background:var(--accent-soft);color:var(--accent)}
.live .pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:18px}
.js{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.js .m{display:flex;align-items:center}
.js .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--surface);flex:none}
.js .ln{flex:1;height:2px;background:var(--line);margin:0 8px}
.js.done .c{background:var(--ok);border-color:var(--ok);color:#fff}.js.done .ln{background:var(--ok)}
.js.cur .c{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.js.sg .c{background:var(--surface-3);border-color:transparent;color:var(--ink-2)}
.js .l{font-size:12px;font-weight:600}.js .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.js.cur .s{color:var(--accent)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.colstack{display:flex;flex-direction:column;gap:16px;min-width:0}
.why{border-left:4px solid var(--crit);padding:18px 22px}
.why.high{border-left-color:var(--high)}.why.mod{border-left-color:var(--mod)}
.why h3{font-size:17.5px;margin:6px 0 4px}
.why .d{font-size:13px;color:var(--ink-2)}
.why .foot{border-top:1px solid var(--line-2);margin-top:12px;padding-top:10px;font-size:11.5px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{padding:7px 11px;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;line-height:1.25}
.fact b{font-size:13px;font-weight:600}.fact span{font-size:10.5px;color:var(--muted)}
.fact.crit{background:var(--crit-soft)}.fact.crit b{color:var(--crit)}.fact.high{background:var(--high-soft)}.fact.high b{color:var(--high)}
.pwmatch{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.pwm{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);text-align:left}
.pwm b{font-weight:600}.pwm .src{margin-left:auto;font-family:var(--mono);font-size:10px;opacity:.85}
.pwm.urgent{background:var(--crit-soft);color:var(--crit)}
.guard{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:9px;background:var(--crit-soft);color:var(--crit);font-size:11.5px;font-weight:500}
.guard.soft{background:var(--mod-soft);color:var(--mod)}
.nba-list{display:flex;flex-direction:column;gap:8px}
.nba{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.nba.on{border-color:var(--accent);background:var(--accent-soft)}
.nba .h{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:left}
.ck{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--surface)}
.nba.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nba .h b{font-size:12.5px;font-weight:600;flex:1}
.nba .sub{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px 40px;font-size:10.5px;color:var(--muted);align-items:center}
.nba .lock{padding:0 12px 10px 40px;font-size:11px;color:var(--high);font-weight:600;text-align:left}
.nba .gd{margin:0 12px 10px 40px}
.say{background:var(--say);color:var(--say-ink);border-radius:var(--r);padding:16px 20px}
.say .hd{display:flex;align-items:center;font-size:12px;font-weight:600;margin-bottom:8px}.say .hd span{margin-left:auto;font-size:11px;opacity:.7;font-weight:500}
.sl{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:5px 0;font-size:12.5px;line-height:1.5}
.sl .t{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--say-tag);padding-top:3px}
.sl.lead{background:rgba(255,255,255,.06);border-radius:8px;padding:10px 12px;margin:0 -6px}
.perm{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;text-align:left}
.perm .tg{width:36px;height:20px;border-radius:12px;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.perm .tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.perm.on{border-color:var(--ok);background:var(--ok-soft)}.perm.on .tg{background:var(--ok)}.perm.on .tg::after{left:18px}
.perm b{display:block;font-size:12.5px;font-weight:600}.perm small{font-size:11px;color:var(--muted)}
.perm[disabled]{opacity:.5;cursor:not-allowed}
.note-warn{font-size:11.5px;color:var(--mod);font-weight:500}
.prof-top{padding:16px 20px;background:var(--info-soft);border-bottom:1px solid var(--line-2)}
.prof-top .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof-sec{padding:10px 20px}
.prof-sec h4{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.prow:last-child{border-bottom:0}
.prow .pd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:#fff}
.prow.ok .pd{background:var(--ok);border-color:var(--ok)}
.prow.miss .pd{border-style:dashed}
.prow .tx{flex:1;min-width:0}.prow .tx b{display:block;font-size:12.5px;font-weight:500}.prow .tx small{font-size:11px;color:var(--muted)}
.src{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.src.A{background:var(--seg-a-soft);color:var(--seg-a)}.src.B{background:var(--seg-b-soft);color:var(--seg-b)}.src.C{background:var(--seg-c-soft);color:var(--seg-c)}.src.X{background:var(--crit-soft);color:var(--crit)}
.pb{border-top:1px solid var(--line-2);padding:14px 20px;background:var(--surface-2)}
.pb .cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--ink-2)}
.fgrid label.wide{grid-column:1/-1}
.oc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.oc-grid .full{grid-column:1/-1}
.oc-l{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.agreed{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:11.5px;font-weight:600}
.agreed button{width:20px;height:20px;border-radius:5px;opacity:.7}
.oc-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line-2);padding:14px 20px;flex-wrap:wrap}
.oc-foot .msg{font-size:12px;color:var(--muted);flex:1;min-width:200px}
.oc-foot .msg.err{color:var(--crit)}
.hist{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding:8px 0;font-size:12px}
.tl .d{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--accent)}
.tl small{color:var(--muted)}

/* ---------- data lens ---------- */
.lens{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.lens-h{padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.lens-h .r{display:flex;align-items:center;gap:8px}
.lens-h h3{font-size:13px}
.lens-h p{font-size:11px;color:var(--muted);margin-top:4px}
.lens-legend{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lens-list{overflow-y:auto;padding:10px 12px 20px;display:flex;flex-direction:column;gap:8px;min-height:0}
.ev{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px;background:var(--surface);animation:evin .35s ease}
@keyframes evin{from{transform:translateY(-4px);opacity:.3}}
.ev .h{display:flex;align-items:center;gap:6px}
.ev .tb{font-family:var(--mono);font-weight:600;font-size:11px}
.ev .tm{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ev .why{all:unset;display:block;color:var(--muted);margin-top:3px;font-size:10.5px}
.ev .cols{margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-family:var(--mono);font-size:10px}
.ev .cols span:nth-child(odd){color:var(--muted)}
.ev .cols span:nth-child(even){color:var(--ink);word-break:break-word}
.ev.WRITE{border-left:3px solid var(--write)}.ev.READ{border-left:3px solid var(--read)}.ev.GX{border-left:3px solid var(--z-gx)}.ev.CDC{border-left:3px solid var(--z-feat)}.ev.GAP{border-left:3px dashed var(--gap)}
.op{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.op.READ{background:var(--read-soft);color:var(--read)}.op.WRITE{background:var(--write-soft);color:var(--write)}.op.GX{background:var(--seg-c-soft);color:var(--z-gx)}.op.CDC{background:var(--ok-soft);color:var(--ok)}.op.GAP{background:var(--crit-soft);color:var(--gap)}.op.CALC{background:var(--surface-3);color:var(--ink-2)}

/* ---------- generic pages ---------- */
.pg-in{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;min-height:0}
.split3{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;height:100%;min-height:0}
.lst{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lst .hd{padding:16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.lst .it{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.li{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;border:1px solid transparent;text-align:left}
.li:hover{background:var(--surface-2)}
.li.on{border-color:var(--accent);background:var(--accent-soft)}
.li .r1{display:flex;align-items:center;gap:8px}.li b{font-size:12.5px;font-weight:600;flex:1}
.li small{font-size:11px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--surface-2)}
.tbl tr.on td{background:var(--accent-soft)}
.tblwrap{overflow-x:auto}
.spark{display:block}
.wcard .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.wcard .metric{display:flex;flex-direction:column;gap:2px}
.wcard .metric span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wcard .metric b{font-size:16.5px;font-weight:600}
.pred{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:11.5px}
.pred ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.locked{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;text-align:center}
.locked .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.frow{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;font-size:12px;padding:4px 0}
.frow .v{text-align:right;font-family:var(--mono);font-size:11.5px}

/* ---------- intelligence ---------- */
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.chain .st{flex:1 0 128px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;flex-direction:column;gap:4px;min-width:128px}
.chain .st b{font-size:12px;font-weight:600}.chain .st small{font-size:10.5px;color:var(--muted);line-height:1.35}
.chain .st .n{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600}
.chain .ar{flex:0 0 22px;display:grid;place-items:center;color:var(--muted)}
.lane{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lane .ln{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2)}
.lane .ln h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lane .ln.tr{background:var(--accent-soft);border-color:transparent}
.lane .ln.ev{background:var(--ok-soft);border-color:transparent}
.care-item{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px}
.care-item small{display:block;font-size:10px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.role{display:grid;grid-template-columns:130px 1fr;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.role b{font-weight:600}
.matrix{border-collapse:collapse;font-size:11px}
.matrix th,.matrix td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
.matrix th{font-weight:600;color:var(--muted);font-size:10px}
.matrix td.n{text-align:left;font-weight:500}
.mx{display:inline-block;width:14px;height:14px;border-radius:4px}
.mx.crit{background:var(--crit)}.mx.high{background:var(--high)}.mx.mod{background:var(--mod)}.mx.low{background:var(--line)}
.branch{display:grid;grid-template-columns:200px 1fr;gap:10px;font-size:11.5px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.branch b{font-weight:600}

/* ---------- library ---------- */
.lib-ed{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2)}
.fld .hint{font-weight:400;color:var(--muted)}
.frow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.blk{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:start}
.blk select{padding:7px 8px;font-family:var(--mono);font-size:10.5px;font-weight:600}
.blk textarea{min-height:52px;font-size:12px}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);font-size:11px;font-weight:500;color:var(--ink-2);background:var(--surface)}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.valid{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.valid div{display:flex;gap:8px;align-items:flex-start}
.valid .y{color:var(--ok);font-weight:700}.valid .n{color:var(--crit);font-weight:700}
.side{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.hit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:11.5px}
.hit b{font-weight:600}
.hit.block{opacity:.75;border-style:dashed}

/* ---------- data flow ---------- */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stp{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.stp .n{width:20px;height:20px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:10px;font-family:var(--mono)}
.stp.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stp.on .n{background:var(--accent);color:var(--on-accent)}
.flowwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.flowsvg{display:block;min-width:1100px;width:100%;height:auto}
.flowsvg text{font-family:var(--sans)}
.fz rect.zb{fill:var(--surface-2);stroke:var(--line)}
.ftab{cursor:pointer}
.ftab rect{fill:var(--surface);stroke:var(--line)}
.ftab text{fill:var(--ink-2);font-family:var(--mono);font-size:10px}
.ftab.r rect{fill:var(--read-soft);stroke:var(--read)}.ftab.r text{fill:var(--read);font-weight:600}
.ftab.w rect{fill:var(--write-soft);stroke:var(--write)}.ftab.w text{fill:var(--write);font-weight:600}
.ftab.dim{opacity:.35}
.farrow{fill:none;stroke:var(--line);stroke-width:2}
.farrow.on{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:7 6;animation:dash 1s linear infinite}
.farrow.on.w{stroke:var(--write)}
.farrow.on.r{stroke:var(--read)}
@keyframes dash{to{stroke-dashoffset:-26}}
.dp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--line-2);align-items:center}
.dp code{font-family:var(--mono);font-size:10.5px}

/* queue card */
.qi{gap:7px}
.qi .r1 .w{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.qi .r1 .w.breach{color:var(--crit);font-weight:600}
.qi .rsn{font-size:12.5px;color:var(--ink)}
.qi .r3{gap:6px;flex-wrap:wrap}
.kv2{display:inline-flex;align-items:baseline;gap:5px;padding:2px 8px;border-radius:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.kv2 i{font-style:normal;font-family:var(--sans,inherit);font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.kv2.crit{background:var(--crit-soft);color:var(--crit)}.kv2.high{background:var(--high-soft);color:var(--high)}.kv2.mod{background:var(--mod-soft);color:var(--mod)}.kv2.ok{background:var(--ok-soft);color:var(--ok)}
.kv2.p{background:var(--accent-soft);color:var(--accent)}
/* actions */
.act2-list{display:flex;flex-direction:column;gap:10px}
.act2{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s,background .15s,box-shadow .15s}
.act2:hover{box-shadow:0 6px 18px -12px rgba(10,15,30,.35)}
.act2.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 70%,var(--surface))}
.act2.dis .bd{opacity:.65}
.act2 .no{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.act2.on .no{background:var(--ok);color:#fff}
.act2 .bd{display:flex;flex-direction:column;gap:6px;min-width:0}
.act2 .tt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act2 .tt b{font-size:14.5px;font-weight:650;line-height:1.3}
.act2 .for{font-size:12px;color:var(--ink-2)}
.act2 .for b{font-weight:600;color:var(--ink)}
.act2 .meta2{display:flex;flex-wrap:wrap;gap:6px}
.act2 .meta2 span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;background:var(--surface-2);font-size:11px;font-weight:500;color:var(--ink-2)}
.act2 .meta2 svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.act2 .lock{font-size:11.5px;color:var(--high);font-weight:600;text-align:left}
.act2 .cta{margin-top:2px}
.agree{height:38px;min-width:132px;padding:0 14px;border-radius:10px;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);font-weight:650;font-size:12.5px;transition:all .15s}
.agree:hover:not([disabled]){background:var(--accent);color:var(--on-accent)}
.agree.on{background:var(--ok);border-color:var(--ok);color:#fff}
.agree[disabled]{border-color:var(--line);color:var(--muted);cursor:not-allowed}
.act2-foot{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11.5px}
.act2-foot .btn{margin-left:auto}
@media (max-width:640px){.act2{grid-template-columns:28px minmax(0,1fr)}.act2 .agree{grid-column:2;justify-self:start}}
/* script pop-up */
.sc-wrap{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.sc-wrap.lens{right:364px}
.sc-wrap>*{pointer-events:auto}
.sc-fab{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 14px;border-radius:23px;background:var(--say);color:var(--say-ink);font-weight:650;font-size:13px;box-shadow:0 10px 28px -10px rgba(10,15,30,.55);transition:transform .15s}
.sc-fab:hover{transform:translateY(-1px)}
.sc-fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.sc-fab kbd{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.14);color:inherit}
.sc-fab.on{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sc-fab.on kbd{background:var(--surface-2)}
.sc-pop{width:min(440px,calc(100vw - 32px));max-height:min(62vh,560px);display:flex;flex-direction:column;border-radius:18px;background:var(--say);color:var(--say-ink);box-shadow:0 24px 60px -18px rgba(10,15,30,.6);overflow:hidden;animation:scIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes scIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
.sc-h{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sc-h b{display:block;font-size:14px}
.sc-h small{display:block;font-size:11px;opacity:.7}
.sc-h>div{flex:1;min-width:0}
.sc-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.sc-ic svg,.sc-x svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
.sc-x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:inherit;opacity:.8}
.sc-x:hover{background:rgba(255,255,255,.1);opacity:1}
.sc-b{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sc-l{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 10px;border-radius:10px}
.sc-l .t{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--say-tag);padding-top:3px}
.sc-l p{margin:0;font-size:14px;line-height:1.55}
.sc-l.lead{background:rgba(255,255,255,.09)}
.sc-l.after{opacity:.45}
.sc-gate{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:6px 10px 0}
.sc-gate::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}
.sc-f{padding:10px 16px 14px;font-size:11px;opacity:.65;border-top:1px solid rgba(255,255,255,.08)}
.work-in{padding-bottom:96px}
@media (max-width:900px){.sc-wrap,.sc-wrap.lens{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.sc-pop{animation:none}}

/* replace hard-coded colours */
.logo{background:var(--accent)!important}
.nav .badge{background:var(--crit-soft)!important;color:var(--crit)!important}
.btn.dawak{background:var(--accent)!important;border-color:var(--accent)!important}
.btn.dawak:hover{background:var(--accent-2)!important}
.btn.dang{background:var(--crit-soft)!important;border-color:transparent!important;color:var(--crit)!important}
.agree.on,.act2.on .no,.resp-auto .ck,.task.done .tk{color:var(--on-accent)!important}
/* light script pop-up */
.sc-pop{border:1px solid var(--line);box-shadow:0 18px 44px -18px rgba(29,41,57,.35)}
.sc-h{border-bottom-color:var(--line)!important}
.sc-ic,.sc-x:hover{background:var(--accent-soft)!important;color:var(--accent)}
.sc-l.lead{background:var(--accent-soft)!important}
.sc-gate::after{background:var(--line)!important}
.sc-f{border-top-color:var(--line)!important}
.sc-fab{border:1px solid var(--line);box-shadow:0 8px 22px -12px rgba(29,41,57,.35)}
.sc-fab kbd{background:var(--accent-soft)!important;color:var(--accent)}
/* light sidebar text */
.rail .nav,.rail .brand b{color:var(--rail-ink)}
.why{border-left-color:var(--crit-soft)!important}
.kdot,.cal-leg{display:none!important}
/* compact "Why we're calling" card */
.why{padding:14px 18px!important}
.why .eyebrow{font-size:10px!important}
.why h3{font-size:16px!important;margin:4px 0 2px!important}
.why .d{font-size:12.5px!important}
.facts{gap:6px!important;margin-top:10px!important}
.fact{padding:6px 10px!important;border-radius:8px!important}
.fact b{font-size:13px!important}
.fact span{font-size:10.5px!important}
.why .also{margin-top:10px;font-size:11px}
/* the two top cards line up: same top, same height */
.cols2{align-items:stretch!important}
.cols2>.card{display:flex;flex-direction:column;margin:0!important}
#consent{border-top:1px solid var(--line)!important}
#consent .card-b{flex:1}
#consent .card-b>div:last-child{margin-top:auto}
/* smaller, see-through script pop-up */
.sc-wrap{gap:8px!important}
.sc-pop{width:min(330px,calc(100vw - 32px))!important;max-height:min(36vh,330px)!important;border-radius:14px!important;
  background:color-mix(in srgb,var(--say) 82%,transparent)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:.9;transition:opacity .15s}
.sc-pop:hover,.sc-pop:focus-within{opacity:1}
.sc-h{padding:9px 10px 8px 12px!important;gap:9px!important}
.sc-h b{font-size:12.5px!important}
.sc-h small{font-size:10.5px!important}
.sc-ic{width:24px!important;height:24px!important;border-radius:7px!important}
.sc-ic svg,.sc-x svg{width:14px!important;height:14px!important}
.sc-x{width:26px!important;height:26px!important}
.sc-b{padding:6px 8px!important;gap:2px!important}
.sc-l{grid-template-columns:50px 1fr!important;gap:8px!important;padding:6px 8px!important;border-radius:8px!important}
.sc-l .t{font-size:9.5px!important;padding-top:2px!important}
.sc-l p{font-size:12px!important;line-height:1.45!important}
.sc-gate{font-size:9.5px!important;margin:4px 8px 0!important}
.sc-f{padding:6px 12px 8px!important;font-size:10.5px!important}
.sc-fab{height:36px!important;padding:0 12px 0 10px!important;font-size:12px!important;gap:6px!important;border-radius:18px!important;opacity:.92}
.sc-fab svg{width:15px!important;height:15px!important}
.why.high,.why.mod{border-left-color:var(--accent-soft)!important}

/* v18 */
.wtabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3);align-self:flex-start;width:max-content}
.wtabs button{height:30px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.wtabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,41,57,.08)}
.wtabs .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:10.5px;display:inline-grid;place-items:center}
.mt-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1280px){.mt-grid{grid-template-columns:1fr}}
.wk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.wk-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.wk-g{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.wk-d{min-height:66px;border-radius:8px;background:var(--surface-2);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk-d.today{outline:1.5px solid var(--accent);background:var(--accent-soft)}
.wk-d .wd{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wk-d .dn{font-family:var(--mono);font-size:11.5px;font-weight:600}
.wk-d .ce{font-size:9.5px;padding:1px 4px;background:var(--accent-soft);color:var(--accent)}
.wk-d .more{font-size:9.5px;color:var(--muted)}
.pend{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--accent-soft)}
.pend .task{background:var(--surface)}
.prow2{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:11px}
.prow2.cur{background:var(--accent-soft);border-color:transparent}
.prow2 .kvs{display:flex;gap:4px;margin-top:4px}
.prow2 .rk{align-self:start;margin-top:2px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.prow2 .rk.first{background:var(--accent);color:var(--on-accent)}
.prow2 .tb{display:flex;flex-direction:column;min-width:0}
.prow2 .tb b{font-size:12.5px}.prow2 .tb small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .tw{font-size:11.5px;white-space:nowrap}.prow2 .tw b.late{color:var(--crit)}
@media (max-width:700px){.prow2{grid-template-columns:24px minmax(0,1fr)}.prow2>*:nth-child(n+3){grid-column:2}}

.prow.off{width:100%;text-align:left;opacity:.5;background:transparent;cursor:pointer;border-radius:10px;transition:opacity .15s,background .15s}
.prow.off:hover{opacity:.9;background:var(--accent-soft)}
.prow.off .pd{border-style:dashed}
.prow.off .on-add{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--accent);white-space:nowrap;padding:4px 8px;border-radius:7px;border:1px dashed var(--accent)}

/* v20 */
.agc{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.agc.ag{background:var(--accent);color:var(--on-accent)}
.agc.nag{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.task.ag{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.task.nag{background:var(--surface);border-style:dashed}
.task.ag.late,.task.nag.late{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));border-style:solid}
.ce.ag{background:var(--accent)!important;color:var(--on-accent)!important}
.ce.nag{background:transparent!important;color:var(--muted)!important;border:1px dashed var(--line)}
.ag-leg{display:flex;gap:16px;font-size:12px;color:var(--ink-2);align-items:center;flex-wrap:wrap}
.ag-leg span{display:inline-flex;align-items:center;gap:6px}
.ag-leg.sm{font-size:11px;gap:10px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.ag{background:var(--accent)}.sw.nag{border:1.5px dashed var(--muted)}
.nfu{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;padding:6px 9px;border-radius:8px;background:var(--accent-soft);font-size:11.5px}
.nfu span{color:var(--muted);font-weight:600}
.nfu b{color:var(--accent);font-weight:600;font-family:var(--mono);font-size:11px}
.nfu.none{background:var(--surface-2)}.nfu.none b{color:var(--muted);font-family:inherit}
.nfu.late{background:var(--crit-soft)}.nfu.late b{color:var(--crit)}
.ctl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ctl li{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:18px}
.ctl li:last-child{padding-bottom:0}
.ctl li:not(:last-child)::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.ctl .dot{width:12px;height:12px;border-radius:50%;margin:4px 5px;background:var(--surface);border:2.5px solid var(--accent)}
.ctl li.act .dot{background:var(--accent)}
.ctl b{font-size:13px;font-weight:600}
.ctl small{margin-left:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.ctl p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}

.saved-bn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.saved-bn .ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;flex:none}
.saved-bn>div{flex:1;min-width:0}.saved-bn b{display:block;font-size:13.5px}.saved-bn small{font-size:12px;color:var(--ink-2)}
.task.just{box-shadow:0 0 0 2px var(--accent);animation:justIn .6s ease}
@keyframes justIn{from{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.task.just{animation:none}}

/* v22 */
.kchip.k-gap,.kchip.k-followup{background:var(--accent-soft);color:var(--accent)}
.ot-ask{flex-basis:100%;display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.ot-ask span{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.mts{display:flex;flex-direction:column;gap:8px}
.mts-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tlist.pend{padding:10px;border-radius:12px;background:var(--accent-soft)}
.tlist.pend .task{background:var(--surface)}
.ellist{display:flex;flex-direction:column;gap:6px}
.el{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.el.ag{background:var(--accent-soft);border-color:transparent}
.el.done{opacity:.65}.el.done .tb b{text-decoration:line-through}
.el.nag{border-style:dashed}
.el .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.el .tb b{font-size:12.5px;font-weight:600}.el .tb small{font-size:11.5px;color:var(--muted)}
.els{flex:none;height:20px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center}
.els.ag{background:var(--accent);color:var(--on-accent)}
.el.sn{background:var(--surface);border-color:var(--accent-soft)}
.els.sn{background:var(--accent-soft);color:var(--accent)}
.els.pend{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.els.done{background:var(--surface-3);color:var(--ink-2)}
.els.nag{color:var(--muted);border:1px dashed var(--line)}

/* v23 */
.bk-row{flex-basis:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.bk-cl{font-weight:600;color:var(--ink)}
.bk-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface-2)}
.bk-seg button{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;color:var(--muted)}
.bk-seg button.on{background:var(--accent);color:var(--on-accent)}
.bk-ok{font-size:11.5px;font-weight:600;color:var(--accent)}
.task .cl{font-size:11px;color:var(--ink-2);font-weight:500}
.task .cl.ok{color:var(--accent);font-weight:600}
.task.done .cl{text-decoration:none}
.tbtns{display:inline-flex;gap:6px;align-items:center}
.bkf{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:10px;background:var(--accent-soft)}
.bkf .ot-ask{background:var(--surface)}
.task.booking{border-color:var(--accent)}
.cdot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--crit)}
.cd{position:relative}
.cev{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);font-size:12px}
.cev.ok{border-style:solid;background:var(--accent-soft)}
.cev .num{font-weight:700;color:var(--accent);min-width:40px}

.bk-err{font-size:11.5px;font-weight:600;color:var(--crit)}
.bk-q{font-size:12px;color:var(--muted)}

/* v27 */
.agc.pl{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
/* v26 */
.fu-gap{min-width:300px;margin-left:6px}
/* v25 */

.cta.done .ck{font-style:normal;color:var(--accent);font-weight:700;flex:none}
.cta.done span{flex:1}
.cta .btn svg{width:14px;height:14px;margin-right:4px;vertical-align:-2px}
.cta.pick{gap:10px}

.bcal-h{display:flex;align-items:center;gap:8px;font-size:12.5px}

.bcal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bcal-g .wd{font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.bcal-g button{height:40px;border-radius:8px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.1}

.bcal-g button.td{border-color:var(--accent)}
.bcal-g button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.bcal-g button.on small{color:var(--on-accent)}
.bcal-g button:disabled{opacity:.35;cursor:not-allowed}
.bcal-g button:not(:disabled):not(.on):hover{border-color:var(--accent)}
.bcal-leg{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.bcal-leg span{display:inline-flex;align-items:center;gap:5px}
.bcal-leg .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.bcal-leg .sw.win{background:var(--accent-soft);border:1px solid var(--accent)}
.bcal-leg .sw.pref{background:var(--accent);border-radius:50%;width:6px;height:6px}
.bcal-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.bcal-t .chip.pref{position:relative}
.bcal-t .chip.pref::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.bcal-t .chip.on.pref::after{background:var(--on-accent)}
.bk-sum{flex-basis:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:12px}
.bk-sum>span{font-weight:700;color:var(--muted);width:14px;text-align:center}
.bk-sum>div{flex:1;display:flex;flex-direction:column;gap:2px}
.bk-sum b{font-weight:600}.bk-sum small{color:var(--muted);font-size:11px}
.bk-sum.ok{background:var(--accent-soft)}.bk-sum.ok>span{color:var(--accent)}
.bk-sum.miss>span{color:var(--crit)}
.bk-sum.err{background:var(--crit-soft);outline:1px solid var(--crit)}
.bk-sum .btn svg{width:13px;height:13px;margin-right:4px;vertical-align:-2px}

/* v29 */

.qwin button.on{background:var(--accent);color:var(--on-accent)}.qwin button.on span{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}

.agc.nd{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.bk-seg button.nofu.on{background:var(--crit);color:#fff}

.la-list{display:flex;flex-direction:column;gap:4px}

.la b{font-weight:600}.la span{color:var(--muted);white-space:nowrap}

/* Signal rules (MEMBER_SIGNAL.signal_code) — each reads named data points and maps to pathways. */
window.SIGNALS={
 REPEAT_ER:{label:'Repeat ER, no follow-up',sev:'high',rule:"COUNT(FACT_ENCOUNTER where encounter_type='ER', admit_ts > now-90d) >= 2 AND no OP GP claim since last discharge",reads:['FACT_ENCOUNTER.encounter_type','FACT_ENCOUNTER.discharge_ts','FACT_CLAIM.claim_type','FACT_CLAIM_LINE.specialty'],paths:['DOH-14','DOH-10']},
 REFILL_GAP:{label:'Possible medicine supply gap',sev:'high',rule:'MEMBER_ADHERENCE.pdc < 80 OR gap_over_30d = true (window 180 d)',reads:['MEMBER_ADHERENCE.pdc','MEMBER_ADHERENCE.supply_run_out_date','FACT_RX_FILL.days_supply'],paths:['DOH-7','WHO-9']},
 STATIN_GAP:{label:'Statin gap with high LDL',sev:'mod',rule:"MEMBER_ADHERENCE.drug_class='Statin' AND pdc < 80 AND last FACT_OBSERVATION LDL > 2.6",reads:['MEMBER_ADHERENCE.pdc','FACT_OBSERVATION.value'],paths:['DOH-7']},
 HBA1C_ABOVE_GOAL:{label:'HbA1c above individual goal',sev:'high',rule:"last FACT_OBSERVATION obs_code='HbA1c' >= 7.0 (default goal; individual goal overrides)",reads:['FACT_OBSERVATION.obs_code','FACT_OBSERVATION.value','FACT_OBSERVATION.observed_at'],paths:['DOH-6','DOH-4']},
 HBA1C_OVERDUE:{label:'HbA1c review overdue',sev:'mod',rule:"MEMBER_CONDITION T2D AND no HbA1c in 180 d (90 d if last above goal)",reads:['MEMBER_CONDITION.condition_code','FACT_OBSERVATION.observed_at'],paths:['DOH-8']},
 BP_ABOVE_TARGET:{label:'BP above target',sev:'high',rule:'last BP >= 130/80 with diabetes or CKD; >= 140/90 otherwise',reads:['FACT_OBSERVATION.obs_code','FACT_OBSERVATION.value','FACT_OBSERVATION.device_type'],paths:['DOH-5','WHO-8']},
 BP_URGENT:{label:'BP in same-day range',sev:'crit',rule:'SBP > 180 or DBP > 110 → ask about symptoms; > 200/110 → same-day referral',reads:['FACT_OBSERVATION.value'],paths:['WHO-5']},
 EGFR_LOW:{label:'eGFR below 60',sev:'high',rule:"last eGFR < 60 (confirm with repeat 1–3 months apart)",reads:['FACT_OBSERVATION.value','SRC_LAB_RESULT.test_code'],paths:['DOH-11','WHO-10']},
 EGFR_CRITICAL:{label:'eGFR below 30',sev:'crit',rule:'last eGFR < 30 → same-day referral',reads:['FACT_OBSERVATION.value'],paths:['WHO-5']},
 KIDNEY_DUE:{label:'Kidney screen due',sev:'mod',rule:'T2D AND no eGFR or UACR in 12 months',reads:['MEMBER_CONDITION.condition_code','FACT_OBSERVATION.observed_at'],paths:['DOH-11']},
 DETERIORATION:{label:'Wearable deterioration',sev:'high',rule:'MEMBER_SCORE.band in (Elevated, High) AND deterioration_delta > 0',reads:['MEMBER_SCORE.score','MEMBER_SCORE.drivers_json','FACT_OBSERVATION.device_type'],paths:['DOH-5','WHO-8']},
 HYPO:{label:'Low glucose on CGM',sev:'crit',rule:'CGM glucose < 3.9 mmol/L in last 7 days',reads:['FACT_OBSERVATION.value','FACT_OBSERVATION.device_type'],paths:['DOH-2','WHO-3']},
 EYE_UNKNOWN:{label:'Eye exam not on record',sev:'low',rule:'T2D AND no retinal exam claim in 24 months → unknown, not normal',reads:['FACT_CLAIM_LINE.code','MEMBER_CONDITION.condition_code'],paths:['DOH-13','WHO-12']},
 FOOT_UNKNOWN:{label:'Foot exam not on record',sev:'low',rule:'T2D AND no foot exam in 12 months → unknown, not normal',reads:['FACT_CLAIM_LINE.code'],paths:['DOH-12','WHO-11']},
 NOREACH:{label:'Not reached on last attempt',sev:'mod',rule:"last DISPOSITION_EVENT.reached = false",reads:['DISPOSITION_EVENT.reached'],paths:['DOH-10']},
 NEW_DX:{label:'New diagnosis',sev:'mod',rule:'MEMBER_CONDITION.first_dx_date within 30 d',reads:['MEMBER_CONDITION.first_dx_date'],paths:['DOH-1','WHO-1','WHO-2']}
};

    ['READ','CONTACT_POLICY',{max_contacts_7d:3,min_gap_hours:24,quiet_hours:'21:00–08:00',result:'allowed'},'Frequency cap and quiet hours across all campaigns'],
    ['WRITE','VERSION_LEASE',{entity_type:'CASE',entity_id:m.caseId,current_seq_no:7,holder:NURSE.id,leased_until:'+15 min'},'Fencing token — a stale write is refused'],
    ['WRITE','ATTEMPT',{attempt_id:c.attempt,case_id:m.caseId,channel:'call'}],
    ['WRITE','ATTEMPT_EVENT',{attempt_id:c.attempt,event_type:'dispatched',script_id:'SCR-CONSENT',script_version:'v2'}],
    ['GX','GX_CONTACT_DISPATCH',{dispatch_id:'DSP-'+(5500+S.seq),attempt_id:c.attempt,phone_token:'tok_'+m.mask+'_7307'},'Number passed as a token, never in clear'],
    ['WRITE','WRITE_LEDGER',{idempotency_key:ikey(),endpoint:'POST /attempts',assigned_seq_no:8},'Replay-safe']
  ]);

A.connect=id=>{const m=byId(id||S.sel),c=call(m.id);c.st='live';c.t0=Date.now();c.secs=0;ensureTick();
  log('GX','GX_CONVERSATION_EVENT',{conversation_id:'CNV-'+(77000+S.seq),user_id:NURSE.gx,event:'connected',recording:'on'},'Recorded call — verbal consent now counts');

A.noAnswer=()=>{const m=byId(S.sel),c=call(m.id),o=ocSt(m.id);c.st='idle';o.reached='No answer';o.attempts++;

A.endCall=()=>{const m=byId(S.sel),c=call(m.id);c.st='ended';log('GX','GX_CONVERSATION_EVENT',{event:'disconnected',duration_s:c.secs});log('WRITE','ATTEMPT_EVENT',{attempt_id:c.attempt,event_type:'completed'});if(!ocSt(m.id).reached)ocSt(m.id).reached='Reached';render();};

/* consent */
A.perm=k=>{const m=byId(S.sel);if(call(m.id).st!=='live')return;m.consent.perms[k]=!m.consent.perms[k];render();};
A.grant=()=>{const m=byId(S.sel);if(call(m.id).st!=='live'||!m.consent.perms.data)return;
  m.consent.status='granted';m.consent.via='Verbal · recorded call';m.consent.when='just now';
  const rows=PERMS.map(([k,l])=>['WRITE','CONSENT_EVENT',{member_id:m.id,purpose:k,channels_allowed:k==='contact'&&m.consent.perms[k]?'call,sms':'—',granted:String(!!m.consent.perms[k]),evidence_ref:call(m.id).attempt},l]);
  txn('Consent captured on a recorded call',rows.concat([['WRITE','V_CONSENT_CURRENT',{member_id:m.id,purpose:'data,care,contact',is_suppressed:'false',last_seq_no:10},'Updated in the same transaction'],['WRITE','WRITE_LEDGER',{idempotency_key:ikey(),endpoint:'POST /consent',target_table:'CONSENT_EVENT'}]]));
  readClinical(m);toast('Consent logged — clinical detail unlocked');render();};
A.decline=()=>{const m=byId(S.sel);m.consent.status='declined';
  txn('Consent declined',[['WRITE','CONSENT_EVENT',{member_id:m.id,purpose:'data',granted:'false'}],['WRITE','SUPPRESSION_EVENT',{member_id:m.id,scope:'campaign',reason_code:'CONSENT_DECLINED',expires_at:'+90 d'}],['WRITE','V_CONSENT_CURRENT',{is_suppressed:'true',suppressed_until:'+90 d'}]]);
  const o=ocSt(m.id);o.reached='Reached';o.response='Declined';render();};

/* profile */
A.pOk=id=>{const m=byId(S.sel);m.profDone[id]=true;const r=m.prof.flatMap(s=>s.rows).find(x=>x.id===id);

A.pbAdd=()=>{const m=byId(S.sel),c=PE_CATS.find(x=>x.k===S.pe.cat),v=S.pe.v;const main=v[c.f[0][0]]||(c.f[0][2]==='select'?c.f[0][3][0]:'');if(!main){S.pe.msg='Enter '+c.f[0][1].toLowerCase()+' first.';render();return;}
  let sec=m.prof.find(s=>s.title===c.sec);if(!sec){sec={title:c.sec,rows:[]};m.prof.push(sec);}
  const id='u'+S.seq;const label=[main,v[c.f[1][0]]].filter(Boolean).join(' ');
  sec.rows.push({id,label,detail:[v[c.f[2][0]],S.pe.src].filter(Boolean).join(' · '),src:S.pe.src});m.profDone[id]=true;
  if(c.k==='lab'&&/LDL/.test(main))m.prof.forEach(s=>s.rows=s.rows.filter(r=>r.id!=='lx'));
  if(c.k==='consult')m.prof.forEach(s=>s.rows=s.rows.filter(r=>r.id!=='v4'));
  const tbl=c.k==='lab'?'FACT_OBSERVATION':c.k==='med'?'FACT_RX_FILL':'MEMBER_ASSERTION_EVENT (proposed)';
  log(tbl==='FACT_OBSERVATION'?'WRITE':'GAP',tbl,c.k==='lab'?{member_id:m.id,source:'member_reported',obs_code:main,value:v.value||'—',observed_at:v.date||'—'}:{member_id:m.id,category:c.k,item:label,source:S.pe.src},c.k==='lab'?'Observation table already has a source column — member-reported fits':'Needs a home in the model');
  S.pe.v={};S.pe.msg='Added '+label;render();};

/* NBA + script */
A.tick=id=>{const m=byId(S.sel),t=ticks(m.id),o=ocSt(m.id),n=LIB.find(x=>x.id===id);const i=t.indexOf(id);
  if(i>=0){t.splice(i,1);o.acts=o.acts.filter(a=>a!==n.label);}else{t.push(id);if(!o.acts.includes(n.label))o.acts.push(n.label);o.noAction=false;
    log('WRITE','ATTEMPT_EVENT',{attempt_id:call(m.id).attempt||'—',event_type:'script_shown',script_id:'SCR-'+n.id,script_version:'v'+n.ver},'Exact script version recorded for audit');}
  if(n.id==='NBA-CP-01'&&!o.cp)o.cp=m.conds.some(c=>c.short==='DM')?'Diabetes management':m.conds.some(c=>c.short==='HTN')?'Hypertension management':'Chronic care';

A.more=()=>{S.nbaMore=!S.nbaMore;render();};
A.noAct=()=>{const m=byId(S.sel),o=ocSt(m.id);o.noAction=!o.noAction;if(o.noAction){S.ticks[m.id]=[];o.acts=[];}render();};

/* outcome */
A.ocReach=v=>{const o=ocSt(S.sel);o.reached=v;o.err='';render();};
A.ocResp=v=>{const o=ocSt(S.sel);o.response=o.response===v?'':v;o.err='';render();};
A.ocBar=v=>{const o=ocSt(S.sel);o.barriers=o.barriers.includes(v)?o.barriers.filter(x=>x!==v):o.barriers.concat(v);render();};
A.ocNext=v=>{const o=ocSt(S.sel);o.next=o.next===v?'':v;render();};
A.ocCp=v=>{ocSt(S.sel).cp=v;render();};
A.ocNotes=v=>{ocSt(S.sel).notes=v;};
A.ocBranch=v=>{const o=ocSt(S.sel);o.branch=o.branch===v?'':v;render();};
A.ocRm=label=>{const m=byId(S.sel),o=ocSt(m.id);o.acts=o.acts.filter(a=>a!==label);const n=LIB.find(x=>x.label===label);if(n)S.ticks[m.id]=ticks(m.id).filter(x=>x!==n.id);render();};
A.save=()=>{const m=byId(S.sel),o=ocSt(m.id),c=call(m.id);
  if(!o.reached){o.err='Choose a call result first.';render();return;}
  if(c.st==='live'||c.st==='dial'){o.err='Finish the call, then record what happened.';render();return;}
  if(o.reached==='Reached'&&!o.response){o.err='Choose the member’s response.';render();return;}
  if(o.reached==='Reached'&&['Engaged','Enrolled in care plan'].includes(o.response)&&!o.acts.length&&!o.noAction){o.err='Tick at least one agreed action, or choose “No action agreed”.';render();return;}
  if(o.acts.includes('Set up refill reminders')&&o.branch==='Prescriber stopped or changed it'){o.err='Refill reminders can’t be used when the prescriber stopped or changed the medicine.';render();return;}
  const codes=o.acts.map(a=>(LIB.find(n=>n.label===a)||{}).code||'ACT_OTHER');
  const dsp='DSP-'+(90000+S.seq);
  const rows=[
    ['READ','DISPOSITION_CODE_SET',{code_set_id:'DCS-HICC',version:'v5'},'Codes pinned to a version'],
    ['WRITE','DISPOSITION_EVENT',{disposition_id:dsp,attempt_id:c.attempt||'—',case_id:m.caseId,reached:String(o.reached==='Reached'),response_code:o.response||o.reached,action_code:codes.join(', ')||'NONE',barrier_codes:o.barriers.join(', ')||'—',wrapup_code:o.next||'—',code_set_version:'v5'},'Nurse disposition is the source of truth — Genesys wrap-up is reference only'],
    ['WRITE','CASE_EVENT',{case_id:m.caseId,status:o.reached!=='Reached'?'retry':o.response==='Declined'?'closed_declined':'actioned',next_action_code:codes[0]||'—',due_at:o.next||'—',seq_no:11}],
    ['WRITE','OPPORTUNITY_EVENT',{opportunity_id:m.oppId,event_type:o.reached==='Reached'?'engaged':'contact_failed'}]];
  if(o.response==='Enrolled in care plan'||o.acts.includes('Offer enrolment in a care plan'))rows.push(['WRITE','CARE_PLAN_EVENT',{care_plan_id:'CP-'+(4100+S.seq),programme_id:o.cp||'Chronic care',event_type:'enrolled',goal_code:m.labs[0]?m.labs[0].k:'—',next_touchpoint_at:'+14 d'}]);
  if(o.notes)rows.push(['WRITE','NOTE_EVENT',{note_id:'NT-'+S.seq,note_type:'call_note',body_text_enc:'••• encrypted •••'}]);
  if(o.reached==='Wrong number')rows.push(['WRITE','CONTACT_POINT_EVENT',{msisdn_token:'tok_'+m.mask+'_7307',event_type:'wrong_number'},'Captured on the call instead of updating the dimension']);
  if(o.branch)rows.push(['GAP','DISPOSITION_EVENT.reason_branch (proposed)',{branch:o.branch},'DoH pathway 7 reason branch has no column yet']);
  if(o.acts.length>1)rows.push(['GAP','DISPOSITION_ACTION (proposed)',{actions:o.acts.length},'action_code holds one value; several agreed actions need a child table']);
  rows.push(['WRITE','V_CASE_CURRENT',{case_id:m.caseId,status:o.reached==='Reached'?'actioned':'retry',last_seq_no:11},'Same transaction — your save shows immediately']);
  rows.push(['WRITE','WRITE_LEDGER',{idempotency_key:ikey(),endpoint:'POST /dispositions',request_hash:'sha256:…'+S.seq}]);
  rows.push(['CDC','→ warehouse',{tables:'DISPOSITION_EVENT, CASE_EVENT, OPPORTUNITY_EVENT',lag:'< 60 s'},'Change data capture feeds MART_FUNNEL and evidence checks']);
  codes.forEach((cd,i)=>{const n=LIB.find(x=>x.code===cd);if(n)rows.push(['READ','OUTCOME_EVIDENCE_EVENT',{opportunity_id:m.oppId,expects:n.evidence,verification_status:'awaiting'},'Closes only when the claim or event proves it']);});
  txn('Outcome saved',rows);
  o.saved=true;S.done.push(m.id);m._status=o.reached!=='Reached'?'noreach':o.response==='Declined'?'declined':o.response==='Enrolled in care plan'?'enrolled':o.acts.length?'agreed':'scheduled';
  m.savedActs=o.acts.slice();m.savedAt='just now';
  toast('Outcome saved for '+m.name);
  S.wTab='tasks';S.justSaved=m.id;
  render();const w=$('.work');if(w)w.scrollTop=0;};

VIEWS.queue=function(){
  const list=queueMembers();
  if(!byId(S.sel)){if(list[0])S.sel=list[0].id;}
  const m=byId(S.sel);
  const qi=x=>`<button class="qi${x.id===S.sel?' on':''}" data-act="sel" data-arg="${x.id}">
    <div class="r1"><b>${esc(x.name)}</b><span class="w${x.trigger.slaH>=24?' breach':''}" title="Flagged ${hrs(x.trigger.slaH)} ago">${x.trigger.slaH>=24?'Overdue · ':''}${hrs(x.trigger.slaH)}</span></div>
    <span class="rsn">${esc(x.trigger.reason)}</span>
    <div class="r3"><span class="kv2 ${sev(x.risk)}" title="Risk score"><i>Risk</i>${x.risk}</span><span class="kv2 p" title="Priority: risk, trigger severity and time waiting"><i>Priority</i>${prioOf(x)}</span><span class="seg ${x.seg}" title="${esc(SEGS[x.seg].label)}">${x.seg}</span>${!hasConsent(x)?'<span class="pill acc">Consent needed</span>':''}</div>${nextFU(x)}</button>`;
  const done=D.filter(x=>S.done.includes(x.id)&&!list.includes(x));

    <div class="qitems" data-keep="qitems">${list.map(x=>`<button class="qav${x.id===S.sel?' on':''}" data-act="sel" data-arg="${x.id}" title="${esc(x.name)} · ${esc(x.trigger.reason)} · risk ${x.risk} · priority ${prioOf(x)}"><span>${initials(x.name)}</span><i class="risk-dot ${sev(x.risk)}"></i></button>`).join('')}</div>
  </aside>
  <main class="work" data-keep="work">${m?workHTML(m):'<div class="empty">Queue is clear.</div>'}</main></div>`;
  return `<div class="qgrid">
  <aside class="qlist" aria-label="Queue">
    <div class="qhead">
      <div class="row"><button class="qtog" data-act="qMin" title="Collapse queue" aria-label="Collapse queue" aria-expanded="true">${svg('chev')}</button><h2>Queue</h2><span class="mono muted">${list.length}</span><span class="muted" style="margin-left:auto;font-size:11px">${S.qWin&&S.qWin!=='today'?'By date':'By priority'}</span></div>
      ${qWinHTML()}<input id="qsearch" type="search" placeholder="Search name, condition or reason" value="${esc(S.q)}" data-in="q" aria-label="Search queue">
    </div>
    <div class="qitems" data-keep="qitems">${list.map(qi).join('')||'<div class="empty">Nothing waiting here.</div>'}
      ${done.length?`<div class="qdone">Done · ${done.length}</div>${done.map(d=>`<button class="qd" data-act="sel" data-arg="${d.id}"><span class="ck">✓</span><span>${esc(d.name)}</span><span class="muted" style="margin-left:auto;font-size:11px">${esc(ocSt(d.id).response||ocSt(d.id).reached)}</span></button>`).join('')}`:''}
    </div>
  </aside>
  <main class="work" data-keep="work">${m?workHTML(m):'<div class="empty">Queue is clear.</div>'}</main></div>`;
};
const pathAct=p=>PAGES.some(x=>x[1]==='intel')?` data-act="openPath" data-arg="${p.id}"`:'';
function workHTML(m){
  const c=call(m.id),o=ocSt(m.id),ps=profStats(m),granted=hasConsent(m),declined=m.consent.status==='declined',pending=m.consent.status==='pending';
  const sg=signalsFor(m),paths=pathsFor(m),nbas=nbaFor(m),tk=ticks(m.id),f=ps.focus;
  const urgent=sg.find(s=>s.sev==='crit');
  /* journey */
  const st=[[m.seg,'Segment '+m.seg,SEGS[m.seg].short,'sg'],
    [2,'Consent',granted?(m.consent.via||'Granted'):declined?'Declined':'Needed to review',granted?'done':declined?'':'cur'],
    [3,'Review · '+f.name,!granted?'After consent':ps.complete?'Done':`${ps.n} of ${ps.t} reviewed`,!granted?'':ps.complete?'done':'cur'],
    [4,'Actions',!granted?'After consent':o.acts.length?o.acts.length+' agreed':o.noAction?'None agreed':'Choose',!granted?'':o.acts.length||o.noAction?'done':ps.complete?'cur':''],
    [5,'Outcome',o.saved?'Saved':'Open',o.saved?'done':'']];
  const JT=['mhead',pending||declined?'consent':'whynow','profile','nba','outcome'];
  const journey=`<div class="journey" role="list">${st.map((s,i)=>`<div class="js ${s[3]}" role="listitem" data-act="jump" data-arg="${JT[i]}" title="Go to ${esc(s[1])}"><div class="m"><span class="c">${s[3]==='done'&&i?'✓':s[0]}</span>${i<4?'<span class="ln"></span>':''}</div><div><div class="l">${esc(s[1])}</div><div class="s">${esc(s[2])}</div></div></div>`).join('')}</div>`;
  const callUI=c.st==='dial'?`<div class="live dial"><span class="pulse"></span>Dialling ${esc(m.phone)}<button class="btn sm" data-act="noAnswer">No answer</button></div>`
    :c.st==='live'?`<div class="live"><span class="pulse"></span><span class="mono" id="ctimer">${fmtT(c.secs)}</span> · Genesys recording<button class="btn sm dang" data-act="endCall">End call</button></div>`
    :`<button class="btn pri" data-act="call" ${o.saved?'disabled':''}>${svg('phone')}${c.st==='ended'?'Call again':'Call '+esc(first(m.name))}</button>`;
  const header=`<section class="card mh" data-screen-label="Member header" id="mhead">
    <div class="r1"><span class="ini" style="background:var(--seg-${m.seg.toLowerCase()}-soft);color:var(--seg-${m.seg.toLowerCase()})">${initials(m.name)}</span>
      <div style="min-width:0"><div class="nm"><b>${esc(m.name)}</b>${segPill(m)}<span class="risk ${sev(m.risk)}">Risk ${m.risk}</span>${prioPill(m)}${m.cp?`<span class="pill ok">${esc(m.cp.prog)}</span>`:''}</div>
      <div class="meta">${m.age} · ${esc(m.sex)} · speaks ${esc(m.lang)} · ${esc(m.plan)} · ${m.source==='real'?'Real claims':m.source==='extract'?'Claims extract · pseudonym':'Synthetic'} · masked ${esc(m.mask)}</div></div>
      <div class="acts"><button class="btn" data-act="go360" data-arg="${m.id}">Member 360</button>${callUI}</div></div>
</section>`;
  /* script — compact, at the top */
  /* why now — visible before consent */
  const facts=[[m.adm12+' adm · '+m.er12+' ER','Last 12 months',m.adm12>3?'crit':''],...m.labs.slice(0,1).map(l=>[`${l.k} ${lastOf(l)}${l.unit==='%'?'%':''}${l.series.length>1&&lastOf(l)>l.series[l.series.length-2]?' ↑':''}`,'Target < '+l.target,lastOf(l)>l.target?'crit':'']),...[...m.meds].sort((a,b)=>a.pdc-b.pdc).slice(0,1).map(x=>[`${x.drug.split(' ')[0]} ${x.pdc}%`,'Adherence',x.pdc<80?'high':'']),[moneyK(m.cost12),'Claims · 12 mo','']];
  const why=`<section class="card why ${sev(m.risk)==='crit'?'':'high'}" data-screen-label="Why now" id="whynow">
    <span class="eyebrow">Why we’re calling · ${esc(m.trigger.kpi)}</span><h3>${esc(m.trigger.reason)}</h3>
    <p class="d">${esc(m.trigger.detail)}.</p><div class="facts">${facts.map(x=>`<span class="fact ${x[2]}"><b class="num">${esc(x[0])}</b><span>${esc(x[1])}</span></span>`).join('')}</div>
    ${urgent?`<div class="pwmatch"><div class="guard">⚠ Urgent: ${esc(urgent.label)} · ${esc(urgent.evidence)}. Check for same-day referral first.</div></div>`:''}
    ${sg.length>1?`<div class="also"><span>Also open</span>${sg.filter(s=>s!==primarySig(m)).slice(0,4).map(s=>`<span class="pill ${s.sev==='crit'?'crit':s.sev==='high'?'high':'mod'}">${esc(s.label)}</span>`).join('')}</div>`:''}
</section>`;
  /* consent */
  const live=c.st==='live';
  const consent=pending?`<section class="card" data-screen-label="Consent" id="consent" style="border-top:3px solid var(--accent)"><div class="card-h"><h3>Consent</h3><span class="r">Verbal · recorded call</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">
    <button class="perm${m.consent.perms.data?' on':''}" data-act="perm" data-arg="all" ${live?'':'disabled'} aria-pressed="${!!m.consent.perms.data}"><span class="tg"></span><span><b>Consent</b><small>Look at and record health history; contact about care.</small></span></button>
    ${live?'':'<p class="note-warn">Recorded call only.</p>'}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="decline" ${live?'':'disabled'}>Declined</button><button class="btn pri" data-act="grant" ${live&&m.consent.perms.data?'':'disabled'}>Log consent</button></div></div></section>`
    :declined?`<section class="card"><div class="card-b"><h3 style="font-size:14px;margin-bottom:6px">Consent declined</h3><p class="muted">No further contact for 90 days. Save the outcome to close the case.</p></div></section>`:'';
  /* profile — focused review */
  const editable=granted;
  const rowH=(r,edit)=>{if(gapOff(m,r))return `<button class="prow off" data-act="gapOn" data-arg="${r.id}" title="Add this to the review for this call"><span class="pd"></span><div class="tx"><b>${esc(r.label)}</b><small>${esc(r.detail)}</small></div><span class="on-add">+ Review</span></button>`;const ok=m.profDone[r.id]??r.pre;const srcL=r.src==='SEHA record'?'SEHA':r.src==='Daman claim'?'Claim':r.src;

  const sg=signalsFor(m)[0];

  if(m.wear&&m.wear.bp)add(rdays(m.wear.sync||'today'),'clin','Home BP '+m.wear.bp.join('/'),m.wear.dev||'Device','Device');
  const lo=[...m.meds].sort((a,b)=>a.pdc-b.pdc)[0];if(lo)add(14,'clin','Pharmacy fill · '+lo.drug,lo.pdc+'% covered over 180 days','Claim',{flag:lo.pdc<80?'Below 80%':''});
  for(let i=0;i<Math.min(m.er12,6);i++)add(35+i*48,'clin','ER visit'+(m.er12>1?' '+(i+1)+' of '+m.er12:''),i===0?m.trigger.reason:'Unplanned attendance',m.seg==='A'&&i%2?'SEHA':'Claim',{key:'er',flag:'Unplanned'});
  if(m.adm12)add(96,'clin','Inpatient admission',m.adm12>1?m.adm12+' in 12 months':'Discharged','Claim',{key:'er'});

}

`;document.head.appendChild(st);})();

/* ===================== Chronic Care Loop · live mode overrides (backend is the source of truth) ===================== */
if(window.CCL&&window.CCL.live){(()=>{const CL=window.CCL,orig=JSON.parse(D0);
  const WHO={'U-0142':COORDS[0],'U-0150':'Omar Khalid','U-0161':'Sara Mansour'};
  D.forEach((m,i)=>{if(!m.live)return;const c=m.live.consent;m.seg=(m.live.phg||0)>0?'A':'B';m.plan=(orig[i]||{}).plan||m.plan;m.consentStep=c==='pending';
    m.consent=c==='granted'?{status:'granted',perms:{data:true,care:true,contact:true},via:'On record',when:'before this run'}:{status:c,perms:{data:false,care:false,contact:false}};
    m.prof=buildProfile(m);m.profDone={};});
  if(!byId(S.sel)){S.sel=D[0].id;S.m360=D[0].id;S.lib.mem=D[0].id;}
  const _sf=signalsFor;signalsFor=function(m){if(!m.live)return _sf(m);
    const out=m.live.sig.filter(s=>SIG[s.code]).map(s=>Object.assign({},SIG[s.code],{code:s.code,trig:s.trig,evidence:s.evidence+(s.state==='cannot_tell'?' · cannot tell from the extract':''),
      points:[[s.trig+' ('+s.campaign+')',s.state==='fired'?'1':'cannot tell']],primary:s.name===m.trigger.reason,unsure:s.state==='cannot_tell'}));
    if(m._status==='noreach')out.push(Object.assign({},SIG.NOREACH,{code:'NOREACH',evidence:'Not reached on the last attempt',points:[['contact.reached','0']]}));
    out.sort((a,b)=>((a.sev==='crit')?-1:0)-((b.sev==='crit')?-1:0)||(b.primary-a.primary)||SEVRANK[a.sev]-SEVRANK[b.sev]);return out;};
  const _ro=riskOf;riskOf=function(m){return m.live&&m.live.risk?m.live.risk:_ro(m);};
  const _al=alertOf;alertOf=function(m){const r=m.live&&m.live.risk;if(!r)return _al(m);
    return {RED:['RED','crit','Same-day clinician · '+r.priority],AMBER:['AMBER','high','Next working day · '+r.priority],YELLOW:['YELLOW','mod','Within 3 days · '+r.priority],GREEN:['GREEN','ok','Digital nudge · '+r.priority]}[r.alert];};
  const SO={CURRENT:0,NEXT:1,FUTURE:2,CLOSED:3},ord=CLS.map(x=>x[0]);
  const _no=needsOf;needsOf=function(m){if(!m.live)return _no(m);const r=riskOf(m),st=cpx(m.id).st;
    const L=m.live.needs.map(n=>Object.assign({},n));L.forEach(n=>{if(n.status!=='open'&&!st[n.k])st[n.k]=n.status;});
    L.sort((a,b)=>SO[a.slot]-SO[b.slot]||ord.indexOf(a.cls)-ord.indexOf(b.cls));
    const open=L.filter(n=>!st[n.k]);open.forEach((n,i)=>{n.slot=i<3?'CURRENT':i<6?'NEXT':'FUTURE';n.due=n.due||isoDay(DUE[n.cls]||7);});
    return {all:L,open,closed:L.filter(n=>st[n.k]),r};};
  seedTasks=function(){const T=[];D.forEach(m=>{if(!m.live)return;m.live.actions.forEach(a=>{const n=m.live.needs.find(x=>x.need_id===a.need);
    T.push({id:a.id,mid:m.id,title:a.title,kind:a.kind==='retry'?'retry':'nba',need:n?n.k:undefined,cls:n?n.cls:undefined,
      due:a.due,as:WHO[a.assignee]||COORDS[0],st:a.status==='open'?'open':'done',res:a.status==='declined'?'declined':a.status==='done'?'done':undefined,db:a.id});});});return T;};
  /* write-through: every care-plan decision and saved call outcome becomes an OUTCOME row in the database */
  const sent=new Set(),apply=(m,r)=>{if(!r||!r.member)return;m.live=r.member.live;m.cp=r.member.cp;m.lastContact=r.member.lastContact;};
  const push=(m,ev,why)=>{try{const r=CL.post(Object.assign({member_id:m.mask,user:'U-0142'},ev));apply(m,r);
      log('WRITE','OUTCOME',Object.assign({member_id:m.mask},ev,{outcome_ids:r.outcomes.join(', ')}),why+' · POST /api/portal/event');}
    catch(e){console.warn('[ccl] write-back failed',e);toast('Not saved to the database: '+e.message);}};
  const reconcile=()=>D.forEach(m=>{if(!m.live)return;const st=cpx(m.id).st;
    m.live.needs.forEach(n=>{const v=st[n.k],key=m.id+'|'+n.k+'|'+v;if(!v||n.status!=='open'||sent.has(key))return;sent.add(key);
      push(m,{kind:'need',need:n.trig,result:v==='declined'?'declined':'done'},'Care-plan need '+n.trig+' '+v);});});
  (()=>{const _d=draw;draw=function(){reconcile();_d();};})();
  (()=>{const _s=A.save;A.save=(...a)=>{const m=byId(S.sel),o=ocSt(m.id),was=o.saved;_s(...a);if(was||!o.saved||!m.live)return;
    push(m,{kind:'call',reached:o.reached==='Reached',response:o.response||o.reached,notes:o.notes||'',consent:['granted','declined'].includes(m.consent.status)?m.consent.status:undefined},'Call outcome');
    render();};})();
  /* timeline: only events the extract or the database actually holds (no invented dates) */
  const _ct=coordTimeline;coordTimeline=function(m){if(!m.live)return _ct(m);
    const E=[],add=(d,kind,title,detail,tag,x)=>E.push(Object.assign({d,kind,title,detail,tag},x||{})),day0=Date.parse(isoDay(0));
    (S.jr[m.id]||[]).forEach((e,i)=>add(0.0001*(i+1),'coord',e.title,e.detail,'This session',{t:e.t}));
    m.live.needs.filter(n=>n.status==='open'&&n.slot==='CURRENT').forEach(n=>add(-Math.max(0.5,(Date.parse(n.due)-day0)/864e5),'coord',n.t,'Care plan · due '+n.due,n.trig,{up:true}));
    m.live.needs.filter(n=>n.status!=='open').forEach(n=>add(0.5,'coord',n.t,n.status==='done'?'Closed as done':'Declined · held until '+(n.hold||''),'Outcome'));
    const sg=signalsFor(m)[0];add(0.2,'coord','Flagged · '+m.trigger.reason,m.trigger.detail,'Nightly run'+(sg?' · '+sg.trig:''));
    if(m.lastContact&&!/no prior/i.test(m.lastContact))add(0.3,'coord','Last call',m.lastContact,'Care team');
    if(m.live.consent==='granted')add(400,'coord','Consent on record','Date not in the extract','Consent');
    m.labs.forEach(l=>add(rdays(l.last),'clin',l.name+' '+lastOf(l)+' '+l.unit,'Target '+(l.dir==='down'?'< ':'> ')+l.target,'Lab',{flag:(l.dir==='down'?lastOf(l)>l.target:lastOf(l)<l.target)?'Off target':''}));
    const lo=[...m.meds].sort((a,b)=>a.pdc-b.pdc)[0];if(lo)add(365,'clin','Adherence · '+lo.drug,lo.pdc+'% of days covered (PDC, last 12 months)','Claims',{flag:lo.pdc<80?'Below 80%':''});
    if(m.er12)add(365,'clin','Emergency visits · '+m.er12,'In the last 12 months','Claims',{key:'er'});
    if(m.adm12)add(365,'clin','Hospital admissions · '+m.adm12,'In the last 12 months','Claims',{key:'er'});
    (m.specs||[]).forEach(sp=>add(365,'clin',sp+' visit','Within the last 12 months','Claims'));
    m.conds.forEach(cd=>add(500,'clin','Diagnosis · '+cd.name,cd.code,'Claims',{key:'dx'}));
    return E.sort((a,b)=>(a.up&&b.up)?b.d-a.d:a.d-b.d);};
  window.__portal_live=CL;
})();}
/* ===================== v8 · Chronic Care Loop integration ===================== */
/* ---- 1. Care plan ⇄ Actions: one need = one action. CARE_PLAN_NEED.need_key is carried on the task (task.need). ---- */
const CLS_L=c=>(CLS.find(x=>x[0]===c)||[c,c])[1];
function planTask(m,k){return tasks().find(x=>x.mid===m.id&&x.need===k&&x.kind!=='retry');}
function linkPlan(m){
  if(!m||LOCKED(m))return;let N;try{N=needsOf(m);}catch(e){return;}
  const T=tasks(),mine=()=>T.filter(x=>x.mid===m.id);
  N.all.forEach(n=>{const t=mine().find(x=>x.need===n.k)||mine().find(x=>!x.need&&['agreed','nba'].includes(x.kind)&&x.title===n.t);if(t){t.need=n.k;t.cls=n.cls;}});
  N.open.filter(n=>n.slot==='CURRENT').forEach(n=>{if(!planTask(m,n.k))T.push({id:'P-'+m.mask+'-'+n.k,mid:m.id,st:'open',title:n.t,kind:'nba',need:n.k,cls:n.cls,due:n.due,as:COORDS[0]});});
}
const linkAll=()=>D.forEach(linkPlan);
function linkHTML(m,n){const t=planTask(m,n.k);
  if(!t)return `<div class="nd-l muted">Becomes an action when it reaches Current</div>`;
  return `<div class="nd-l"><span>↳ Action · ${t.st==='done'?'✓ '+(t.res||'done'):esc(relDay(t.due))} · ${esc(String(t.as).replace(' (you)',''))}</span><button class="btn sm ghost" data-act="openTask" data-arg="${m.id}">Open in Actions</button></div>`;}
A.openTask=id=>{S.tMem=id;S.tF='all';A.go('actions');};
A.openPlan=id=>{S.cpSel=id;A.go('care');};
(()=>{const _tl=taskLine;taskLine=function(x,...r){const h=_tl(x,...r);if(!x.need)return h;
  const chip=`<button class="cpl" data-act="openPlan" data-arg="${x.mid}" title="Open this member’s care plan">Care plan · ${esc(CLS_L(x.cls||''))}</button>`;
  return h.replace('</b><small>','</b>'+chip+'<small>').replace(' · Care plan action','');};})();
/* any way a linked action closes (tick, booking, refill, call) closes its care-plan need; reopening reopens it */
function syncPlan(){tasks().forEach(x=>{if(!x.need||x.kind==='retry')return;const X=cpx(x.mid);
  if(x.st==='done'&&!X.st[x.need]){X.st[x.need]=x.res==='declined'?'declined':'done';x.res=x.res||'done';X.log.unshift({t:nowT(),what:x.title,o:X.st[x.need],next:'From Actions'});linkPlan(byId(x.mid));}
  else if(x.st==='open'&&x.res&&X.st[x.need]){delete X.st[x.need];delete x.res;}});}
(()=>{const _d=draw;draw=function(){syncPlan();_d();};})();
(()=>{const _s=A.save;A.save=(...a)=>{_s(...a);const m=byId(S.sel);linkPlan(m);};})();
(()=>{const _g=A.grant;A.grant=(...a)=>{_g(...a);linkPlan(byId(S.sel));};})();
linkAll();

/* ---- 2. Bridge to Chronic Care Studio (when embedded as screen 3): call list + focus in, outcomes out ---- */
const BR={embedded:window.parent!==window,queued:[],campaign:''};
const byMask=k=>D.find(x=>x.mask===k);
(()=>{const _q=queueMembers;queueMembers=function(){const l=_q();if(!BR.queued.length)return l;
  const isQ=m=>BR.queued.includes(m.mask);return l.filter(isQ).concat(l.filter(m=>!isQ(m)));};})();
window.addEventListener('message',e=>{if(!BR.embedded||e.source!==window.parent)return;const d=e.data||{};if(d.type!=='ccl:sync')return;
  BR.queued=(d.queued||[]).filter(byMask);BR.campaign=d.campaign||'';
  BR.queued.forEach(k=>{const m=byMask(k);if(m&&!['new','agreed','scheduled','noreach'].includes(m._status)&&!S.done.includes(m.id))m._status='new';});
  if(d.focus){const m=byMask(d.focus);if(m){S.page='queue';S.qMin=false;onSelect(m.id);}}
  render();});
(()=>{const _d=draw;draw=function(){_d();if(!BR.queued.length)return;
  document.querySelectorAll('.qi[data-arg]').forEach(el=>{const m=byId(el.dataset.arg);if(m&&BR.queued.includes(m.mask)&&!el.querySelector('.fromst')){const b=document.createElement('span');b.className='fromst';b.textContent='From care intelligence'+(BR.campaign?' · '+BR.campaign:'');el.prepend(b);}});};})();
(()=>{const _s=A.save;A.save=(...a)=>{const m=byId(S.sel),was=ocSt(m.id).saved;_s(...a);const o=ocSt(m.id);
  if(BR.embedded&&!was&&o.saved)window.parent.postMessage({type:'ccl:writeback',id:m.mask,name:m.name,response:o.response||o.reached,actions:o.acts.length,tasks:tasks().filter(x=>x.mid===m.id&&x.st==='open').length},'*');};})();
if(BR.embedded)window.parent.postMessage({type:'ccl:ready'},'*');
window.__portal={S,D,A,byId,needsOf,planTask,cpx,LOCKED,tasks,render}; /* test hook */

(()=>{const st=document.createElement('style');st.textContent=`
.nd-l{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;padding-top:6px;border-top:1px dashed rgba(120,130,160,.25)}.nd-l .btn{padding:2px 8px}
.cpl{border:0;border-radius:10px;padding:1px 8px;margin:3px 0;font:600 10.5px 'IBM Plex Sans',sans-serif;background:rgba(52,69,196,.1);color:#3445C4;cursor:pointer;align-self:flex-start}
.rail a.nav{text-decoration:none;color:inherit}
.fromst{display:block;font:600 10.5px 'IBM Plex Mono',monospace;color:#3F6C9F;margin-bottom:4px}
`;document.head.appendChild(st);})();

onSelect(S.sel);
render();

})();
</script>
